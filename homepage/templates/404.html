<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 – страница не найдена</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
</head>
<body>
    <nav class="nav">
        <a class="nav-link" href="/">Главная</a>
        <a class="nav-link" href="/games/">Игры</a>
        <a class="nav-link" href="/achievements/">Достижения</a>
        <a class="nav-link" href="/progress/">Прогресс</a>
    </nav>
    <main class="container mt-5">
        <div class="text-center">
            <h1 class="display-4 text-danger">404</h1>
            <p class="lead">Страница не найдена</p>
            <p class="text-muted">{{ message }}</p>
            <p class="text-muted"><small>Запрошен адрес: {{ path }}</small></p>
            <a href="/" class="btn btn-primary mt-3">
                На главную
            </a>
        </div>
    </main>
</body>
</html>
