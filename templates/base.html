{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Game Achievement Tracker{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <img
        src="{% static 'homepage/img/logo.png' %}"
        alt="Game Achievement Tracker"
        class="app-logo"
    >

    {% include "includes/navigation.html" %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container mt-4 mb-3">
        <p class="text-muted">
            © <span id="current-year"></span> Game Achievement Tracker
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
