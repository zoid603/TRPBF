{% if progress.status == "Получено" %}
    <span class="badge progress-status progress-status-done">{{ progress.status }}</span>
{% elif progress.status == "В процессе" %}
    <span class="badge progress-status progress-status-active">{{ progress.status }}</span>
{% else %}
    <span class="badge progress-status progress-status-new">{{ progress.status }}</span>
{% endif %}
